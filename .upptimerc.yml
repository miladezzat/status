# Change these first
owner: InBrief-Inc # The organization this repository actually lives in. It read
# `miladezzat` until now, and only worked because GitHub keeps serving a rename
# redirect - which stops the day anyone creates a repository at that old path.
repo: status # The name of this repository

# Schedule uptime checks every hour instead of default 5 minutes
schedule:
  cron: "0 * * * *"

sites:
  - name: InBrief Web
    url: https://inbrief.sh
  - name: InBrief API
    url: https://api.inbrief.sh/api/health
  - name: InBrief App
    url: https://app.inbrief.sh

notifications:
  - type: email
    recipients:
      - ${{ secrets.UPPTIME_NOTIFICATION_EMAIL }}
    events:
      - down
      - degraded
      - up

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.inbrief.sh
  # baseUrl: /your-repo-name
  # The InBrief mark, served from this repository rather than from inbrief.sh.
  # A logo loaded from the thing being monitored is a logo that breaks during
  # the outage this page exists to report, which is the same reason the page
  # itself is on GitHub Pages and not on the server.
  logoUrl: https://raw.githubusercontent.com/InBrief-Inc/status/master/assets/inbrief-mark.svg
  name: InBrief Status
  introTitle: "**InBrief Status** makes uptime data for InBrief services available in real time."
  introMessage: Monitor the live health of the InBrief web app and API, and let issues surface incidents so the team can respond fast.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/InBrief-Inc/status

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
